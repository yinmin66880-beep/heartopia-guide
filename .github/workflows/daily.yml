name: daily-intel

# 每日情报自动更新管道（北京时间）：
#   06:10 —— 物资点位 06:00 刷新后（主帖可能已更新位置）
#   11:40 —— 社区每日攻略帖（筱鑫约 10:30-11:00 发布天气/物资/预告）
#   18:10 —— 兑换码 18:00 更新后
#   18:40 —— 兑换码兜底：作者实际发布时间 18:00-18:20，18:10 那次可能抢跑
#   19:40 / 21:10 —— 晚间冗余槽位：2026-09-26 实测 GitHub 高负载丢弃了
#           18:10/18:40/23:30 全部三次运行（当日 5 次调度仅 2 次执行且
#           延迟 2-5 小时），多槽位提高当日码实时上线的概率；即使全部
#           丢弃，v2.2 的 14 天回填窗口也会在次日运行时自动补档
#   23:30 —— 晚间兜底：此时仍无当日数据则任务标红提醒人工介入
# 抓取成功后自动 commit data/daily.* 与天气文件，若仓库开启 GitHub Pages 会随之自动重新部署。
# 注意：GitHub 定时任务可能有数分钟延迟；公开仓库 60 天无活动会暂停定时任务。

on:
  schedule:
    - cron: '10 22 * * *'
    - cron: '40 3 * * *'
    - cron: '10 10 * * *'
    - cron: '40 10 * * *'
    - cron: '40 11 * * *'
    - cron: '10 13 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intel

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily intel pipeline
        run: python scripts/fetch_daily.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "heartopia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.js data/daily.json data/weather.js data/weather-en.js data/weather-ja.js data/weather-ko.js data/codes-history.js data-src/weather-calendar.json
          if git diff --cached --quiet; then
            echo "今日数据无变化，跳过提交"
          else
            git commit -m "chore(daily): auto update intel $(date -u +%F)"
            # 并发运行（延迟的定时任务挤在一起时）可能抢先推送导致 fetch first 被拒：
            # rebase 到最新远端后重试；数据文件冲突时仍失败退出，由下次运行自愈
            if ! git push; then
              echo "推送被拒（远端已前移），rebase 后重试"
              git pull --rebase
              git push
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # 等待 Cloudflare Pages 完成自动部署（静态站通常 1-2 分钟），确保 key 文件与最新数据已上线
      - name: Wait for deploy
        if: steps.commit.outputs.pushed == 'true'
        run: sleep 180

      # IndexNow：通知 Bing/Yandex/Naver 等重新抓取今日更新的页面
      - name: Ping IndexNow
        if: steps.commit.outputs.pushed == 'true'
        run: python scripts/ping_indexnow.py
