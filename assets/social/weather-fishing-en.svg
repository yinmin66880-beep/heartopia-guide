<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Heartopia Guide: check the weather, plan your fishing route</title>
  <desc id="desc">Original evergreen illustration of a cloud, fish, and route. It asks players to confirm the date, source, and server coverage. No actual forecast or game screenshot is shown.</desc>
