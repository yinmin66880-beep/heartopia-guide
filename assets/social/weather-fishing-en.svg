    <text x="64" y="158" font-size="15" font-weight="700" letter-spacing="3" fill="#467360">A LITTLE PLANNING. MORE PLAY.</text>
    <text x="60" y="237" font-size="63" font-weight="780" letter-spacing="-2.8">Check the weather.</text>
    <text x="60" y="311" font-size="63" font-weight="780" letter-spacing="-2.8">Plan your</text>
    <text x="60" y="385" font-size="63" font-weight="780" letter-spacing="-2.8">fishing route.</text>
    <text x="64" y="438" font-size="23" fill="#4b6b5c">Date. Source. Server coverage.</text>
    <text x="64" y="471" font-size="23" fill="#4b6b5c">Check all three before you go.</text>
    <g transform="translate(64 518)"><rect width="294" height="56" rx="28" fill="#1d604d"/><text x="24" y="36" fill="#fffbed" font-size="21" font-weight="650">heartopiaguide.net</text><path d="M254 28h14m-6-6 6 6-6 6" stroke="#fffbed" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
    <text x="388" y="552" font-size="14" fill="#5c7667">Community-sourced references.</text>
    <text x="388" y="574" font-size="14" fill="#5c7667">Check the scope shown on the page.</text>
  </g>
